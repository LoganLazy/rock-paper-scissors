version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rock-paper-scissors
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - NODE_ENV=production
      - PORT=8787
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8787/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - rps-network

  nginx:
    image: nginx:alpine
    container_name: rps-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      # 前端构建产物：nginx 从这里提供页面（nginx.conf 的 root 是 /app/dist）。
      # 部署前必须先在宿主机上构建：npm ci && npm run build。
      # 注意：dist/ 未入库，若跳过构建，Docker 会自动创建一个空目录挂载进来，页面将全部 404。
      - ./dist:/app/dist:ro
    depends_on:
      - app
    networks:
      - rps-network

networks:
  rps-network:
    driver: bridge
